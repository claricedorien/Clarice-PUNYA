<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f03828"/>
      <stop offset="65%" stop-color="#c91a14"/>
      <stop offset="100%" stop-color="#8a0f0a"/>
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Dark container -->
  <rect width="64" height="64" rx="14" fill="#05070a"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#222b30" stroke-width="1.2"/>
  
  <!-- Vermilion Imperial Seal Disc -->
  <circle cx="32" cy="32" r="23" fill="url(#sealBg)" filter="url(#subtleGlow)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ff826e" stroke-width="0.8" stroke-opacity="0.45"/>

  <!-- Chinese "章" (Zhang - Emblem / Seal / Mark) Calligraphic Geometry in Pale Ivory Bone (#dfe7e0) -->
  <g fill="#dfe7e0" stroke="#dfe7e0">
    <!-- Top Dot / Crest of 立 -->
    <path d="M32 16.5 C33 16.5 33.8 17.5 33.5 19.5 C33.2 21 32.5 21.5 32 21.5 C31.5 21.5 30.8 21 30.5 19.5 C30.2 17.5 31 16.5 32 16.5 Z" stroke-width="0.5"/>
    
    <!-- Top Horizontal Bar of 立 -->
    <rect x="22" y="22" width="20" height="2.4" rx="1.2" stroke-width="0"/>
    
    <!-- Left & Right slanted inner strokes of 立 -->
    <path d="M26.5 25.5 L24.5 29" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M37.5 25.5 L39.5 29" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Lower broad base horizontal bar of 立 -->
    <rect x="19" y="30" width="26" height="2.4" rx="1.2" stroke-width="0"/>
    
    <!-- Lower character 早: The Box (日) and Vertical/Cross -->
    <!-- 日: Outline Box -->
    <rect x="23.5" y="34.5" width="17" height="10" rx="1" fill="none" stroke-width="2.2"/>
    <!-- 日: Middle Bar -->
    <line x1="24.5" y1="39.5" x2="39.5" y2="39.5" stroke-width="1.8"/>
    
    <!-- Center Vertical Cross / Downward Pillar of 十 -->
    <line x1="32" y1="44.5" x2="32" y2="50.5" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Horizontal Cross Bar of 十 -->
    <rect x="20.5" y="47.5" width="23" height="2.2" rx="1.1" stroke-width="0"/>
  </g>
  
  <!-- Subtle gold corner registration accents -->
  <circle cx="8" cy="8" r="1.5" fill="#c9a24a" opacity="0.6"/>
  <circle cx="56" cy="8" r="1.5" fill="#c9a24a" opacity="0.6"/>
  <circle cx="8" cy="56" r="1.5" fill="#c9a24a" opacity="0.6"/>
  <circle cx="56" cy="56" r="1.5" fill="#c9a24a" opacity="0.6"/>
</svg>
